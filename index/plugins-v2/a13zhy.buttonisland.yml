id: a13zhy.buttonisland
name: 按钮岛
version: 1.0.0.0
apiVersion: 2.1.0.0
description: 在屏幕右下角放一排快捷按钮，点一下就把「某个按钮被点了」交给 ClassIsland 自动化去处理。支持按钮增删改与排序、收起成一条细手柄后点开、按钮点击注册为自动化触发器（被点击 / 被再次点击，也可选任意按钮），设置页可配悬浮窗行为与全局快捷键。
entranceAssembly: "ButtonIsland.dll"
url: https://github.com/a13zhy/ButtonIsland
tagPattern: 1.**
